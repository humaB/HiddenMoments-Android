name: Build Hidden Moments APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q android-app.zip -d extracted
          SETTINGS_FILE=$(find extracted -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Could not find Gradle settings file in android-app.zip"
            find extracted -maxdepth 5 -type f | head -80
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        shell: bash
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "APK output was not found"
            exit 1
          fi
          echo "APK_PATH=$ANDROID_PROJECT_DIR/$APK_PATH" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: hidden-moments-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
